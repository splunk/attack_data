author: Maria Jose Erquiaga
id: 58c8930b-66e5-4f65-826d-46a2136eeb76
date: '2026-09-29'
description: >-
  AWS CloudTrail events generated by an AWS identity making a successful
  Secrets Manager BatchGetSecretValue API call. This API allows multiple
  secret values to be retrieved in a single request and may be used by an
  attacker with compromised AWS credentials to collect application
  credentials, API tokens, database passwords, and other sensitive material
  while generating fewer CloudTrail events than repeated GetSecretValue
  requests. Sensitive account, access-key, identity, network, secret, and
  region values were replaced with synthetic values.
environment: attack_range
directory: aws_anomalous_secrets_manager_batch_retrieval
