directory: eventlog_enumeration
mitre_technique:
- T1654
datasets:
- name: eventlog_enumeration
  path: /datasets/attack_techniques/T1654/eventlog_enumeration/eventlog_enumeration.log
  sourcetype: XmlWinEventLog
  source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
- name: cisco_evm
  path: /datasets/attack_techniques/T1654/eventlog_enumeration/cisco_evm.log
  sourcetype: cisco:evm:process_activity
  source: not_applicable
