date: '2026-09-29'
description: >-
  AWS CloudTrail events generated by an AWS identity making 12 successful
  EC2 Instance Connect SendSSHPublicKey API calls against an EC2 instance
  within approximately 14 seconds. EC2 Instance Connect uses the AWS control
  plane to make an ephemeral SSH public key available to an operating-system
  user, enabling direct SSH access to the virtual machine. A burst of these
  events may indicate automated access attempts or lateral movement using
  compromised AWS credentials. Sensitive account, identity, instance,
  network, public-key, and region values were replaced with synthetic values.
environment: attack_range
