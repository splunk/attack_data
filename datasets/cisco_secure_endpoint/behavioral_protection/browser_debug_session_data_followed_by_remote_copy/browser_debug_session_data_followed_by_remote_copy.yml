description: Live Cisco Secure Endpoint BP alerts from an ordered Edge remote-debugging launch and forced
  shutdown, followed 33 seconds later by rclone copying session_cookie.json to a controlled SMB sink.
  An actual loopback HTTP response seeded a synthetic cookie, CDP Storage.getCookies exported it as the
  133-byte JSON file, and independent sink SHA256 matched the source. Edge 158 required interactive edge://inspect
  approval for default-profile CDP access.
environment: Windows Server 2022 lab with Cisco Secure Endpoint 8.6.4 and Cisco Security Cloud TA 4.2.0
