description: Live Cisco Secure Endpoint Behavioral Protection alerts from exporting a Windows HKLM\SOFTWARE hive containing a harmless lab marker, then using rclone to copy the exact exported file to a separate lab-controlled SMB server. The 73,740,288-byte source and sink files had the same SHA256 hash. The dataset contains only the two alert events, not the hive itself; no SAM or SECURITY hive was copied.
environment: Windows Server 2022 lab with Cisco Secure Endpoint 8.6.4, rclone 1.76.0, and Cisco Security Cloud TA 4.2.0
