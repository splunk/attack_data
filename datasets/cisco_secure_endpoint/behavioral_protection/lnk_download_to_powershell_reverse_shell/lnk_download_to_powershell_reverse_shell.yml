description: Live Cisco Secure Endpoint Behavioral Protection alerts from opening a real Windows shortcut that launched hidden PowerShell, downloaded a functional Nishang-style reverse-shell script from a loopback HTTP listener, and executed it. The HTTP listener recorded two GET requests; the loopback TCP listener sent a harmless host-name command and received EC2AMAZ-637FDSD in response. The dataset contains one PowerShell Download String, one LNK Launches PowerShell, and one Nishang Reverse Shell alert from the same endpoint and process GUID; duplicate LNK and wrapper alerts were excluded. No payload or remote endpoint outside the lab is included.
environment: Windows Server 2022 lab with Cisco Secure Endpoint 8.6.4 and Cisco Security Cloud TA 4.2.0
