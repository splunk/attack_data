description: Live Cisco Secure Endpoint Behavioral Protection alerts from backing up a seeded SQL Server 2022 Express database with sqlcmd, then copying the exact .bak file by rclone to a separate lab-controlled SMB server. The test database contained one harmless row, SQL RESTORE VERIFYONLY with checksum succeeded, and the 3,067,904-byte source and sink backups had the same SHA256 hash. The dataset contains only the two alert events, not the backup file.
environment: Windows Server 2022 lab with Cisco Secure Endpoint 8.6.4, SQL Server 2022 Express, rclone 1.76.0, and Cisco Security Cloud TA 4.2.0
