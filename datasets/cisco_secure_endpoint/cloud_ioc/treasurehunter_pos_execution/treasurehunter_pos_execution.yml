date: '2026-11-27'
description: |-
  A live Cisco Secure Endpoint Cloud IOC alert generated by copying the benign Windows whoami.exe binary to an AppData\Roaming directory with a 32-character name, renaming it jucheck.exe, and executing it with a 64-character hexadecimal argument. The process exited with an argument error, and the copied file and directory were removed. The dataset contains the single TreasureHunter POS-style Cloud IOC alert exported from Splunk; no POS malware was run.
environment: Windows Server 2022 lab with Cisco Secure Endpoint 8.6.4 and Cisco Security Cloud TA 4.2.0
directory: cisco_secure_endpoint/cloud_ioc/treasurehunter_pos_execution
mitre_technique:
  - T1036.005
datasets:
  - name: treasurehunter_pos_execution
    path: /datasets/cisco_secure_endpoint/cloud_ioc/treasurehunter_pos_execution/cisco_se.log
    source: not_applicable
    sourcetype: cisco:se
